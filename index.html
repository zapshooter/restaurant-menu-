<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurant Menu</title>
  <style>
    /* Basic Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* Container Grid */
    .container {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      background: #121212;
      border-right: 1px solid #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    .logo-section {
      text-align: center;
    }

    .logo-section img {
      width: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .logo-section h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .logo-section p {
      font-size: 12px;
      color: #ff5349;
      font-weight: bold;
    }

    .section-title {
      font-weight: bold;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .links-list {
      list-style: none;
      color: #bbb;
      font-size: 14px;
      cursor: pointer;
    }

    .links-list li {
      line-height: 2.5;
      user-select: none;
    }

    /* Topbar */
    .topbar {
      background: #121212;
      height: 60px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 0 20px;
      justify-content: flex-end;
    }

    .search-input {
      flex-grow: 1;
      max-width: 300px;
      padding: 7px 10px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    .topbar button {
      padding: 8px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease;
      color: white;
    }

    .signup-btn {
      background-color: #ff4a4a;
    }

    .signup-btn:hover {
      background-color: #d43939;
    }

    .login-btn {
      background-color: #ee2e2e;
    }

    .login-btn:hover {
      background-color: #c52626;
    }

    .user-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
    }

    /* Banner */
    .banner {
      margin: 15px 20px;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .banner img {
      max-width: 100%;
      object-fit: cover;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgb(255 42 47 / 0.4);
    }

    /* Menu Grid */
    .menu-grid {
      padding: 20px;
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    }

    /* Card */
    .menu-card {
      background-color: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 0 6px #ff4a4a;
      padding: 15px;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .menu-card img {
      width: 100%;
      border-radius: 12px;
      max-height: 160px;
      object-fit: cover;
      border: 1.5px solid #ff4a4a;
    }

    .item-name {
      font-weight: 600;
      margin-top: 6px;
      font-size: 16px;
    }

    .item-price {
      color: #aaa;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .add-btn {
      width: 30px;
      height: 30px;
      background-color: #2a2a2a;
      color: white;
      border-radius: 6px;
      border: none;
      font-weight: 900;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
      user-select: none;
    }

    .add-btn:hover {
      background-color: #ff4a4a;
    }
  </style>
</head>

<body>
  <div class="container">
    <aside class="sidebar">
      <div class="logo-section">
        <img src="restlogo.png" alt="Chef Icon" />
        <h1>Your Restaurant Menu</h1>
        <p>Your Slogan</p>
      </div>

      <div>
        <p class="section-title">Quick Links</p>
        <ul class="links-list">
          <li>1. Home</li>
          <li>2. Your Orders</li>
          <li>3. Wallet</li>
          <li>4. Profile</li>
          <li>5. Logout</li>
        </ul>
      </div>

      <div>
        <p class="section-title">More About Us</p>
        <ul class="links-list">
          <li>1. Our blog</li>
          <li>2. Upcoming Dishes</li>
          <li>3. Our Story</li>
          <li>4. Social Media Links</li>
        </ul>
      </div>
    </aside>

    <main>
      <div class="topbar">
        <input type="search" id="searchInput" class="search-input" placeholder="Search Food Item" />
        <button class="signup-btn">Signup</button>
        <button class="login-btn">Login</button>
        <img class="user-icon" src="restlogo.png" alt="User Icon" />
      </div>

      <section class="banner">
        <img src="banner.png" alt="Delicious Food Banner" />
      </section>

      <section>
        <h2 style="padding: 0 20px 10px 20px;">Menu</h2>
        <div id="menuGrid" class="menu-grid"></div>
      </section>
      
    </main>
  </div>

  <script>
    const menuGrid = document.getElementById('menuGrid');
    const searchInput = document.getElementById('searchInput');

    // 1. getMenu: fetch menu and display
    async function getMenu() {
      try {
        const response = await fetch('https://raw.githubusercontent.com/saksham-accio/f2_contest_3/main/food.json');
        if (!response.ok) throw new Error('Failed to fetch menu');
        const menu = await response.json();
        displayMenu(menu);
        return menu;
      } catch (err) {
        console.error(err);
        alert('Failed to load menu.');
        return null;
      }
    }

    // Display menu items
    function displayMenu(menu) {
      const localImagePath = 'burger.png'; // Local fallback image for all items
      menuGrid.innerHTML = '';
      menu.forEach(item => {
        const card = document.createElement('div');
        card.classList.add('menu-card');
        card.innerHTML = `
          <img src="${localImagePath}" alt="${item.name}" />
          <div class="item-name">${item.name}</div>
          <div class="item-price">$${item.price}/-</div>
        `;
        menuGrid.appendChild(card);
      });
    }

    // 2. TakeOrder: returns promise that resolves in 2500ms with 3 random burgers
    function TakeOrder(menu) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (!menu || menu.length === 0) {
            reject('No menu available');
            return;
          }
          const burgers = menu.filter(item => item.name.toLowerCase().includes('burger'));
          let selected = [];
          if (burgers.length >= 3) {
            while (selected.length < 3) {
              const random = burgers[Math.floor(Math.random() * burgers.length)];
              if (!selected.includes(random)) selected.push(random);
            }
          } else {
            while (selected.length < 3) {
              const random = menu[Math.floor(Math.random() * menu.length)];
              if (!selected.includes(random)) selected.push(random);
            }
          }
          resolve({ orderedItems: selected });
        }, 2500);
      });
    }

    // 3. orderPrep: returns promise resolving in 1500ms
    function orderPrep() {
      return new Promise(resolve => {
        setTimeout(() => {
          resolve({ order_status: true, paid: false });
        }, 1500);
      });
    }

    // 4. payOrder: returns promise resolving in 1000ms
    function payOrder() {
      return new Promise(resolve => {
        setTimeout(() => {
          resolve({ order_status: true, paid: true });
        }, 1000);
      });
    }

    // 5. thankyouFnc: alerts thank you message
    function thankyouFnc() {
      alert('Thank you for eating with us today!');
    }

    // Automatically run full order flow after menu loads
    window.onload = async () => {
      try {
        const menu = await getMenu();
        if (!menu) throw new Error('Menu fetch failed');
        const order = await TakeOrder(menu);
        console.log('Order:', order);
        const prep = await orderPrep();
        console.log('Order prepared:', prep);
        const payment = await payOrder();
        console.log('Payment done:', payment);
        if (payment.paid) thankyouFnc();
      } catch (err) {
        console.error('Ordering error:', err);
        alert('Something went wrong with your order. Please try again later.');
      }
    };

    // Search functionality
    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      getMenu().then(menu => {
        if (!menu) return;
        const filtered = menu.filter(item => item.name.toLowerCase().includes(query));
        displayMenu(filtered);
      });
    });
  </script>
</body>

</html>
